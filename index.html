<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusJEE Pro | Smart Library</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const Icon = ({ path, size = 24, className = "", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Menu: (p) => <Icon {...p} path={<><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></>} />,
            X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
            BookOpen: (p) => <Icon {...p} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />,
            Lock: (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />,
            Layout: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></>} />,
            Folder: (p) => <Icon {...p} path={<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>} />,
            FolderPlus: (p) => <Icon {...p} path={<><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></>} />,
            Trash2: (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />,
            Settings: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />,
            Play: (p) => <Icon {...p} fill="currentColor" path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
            CheckCircle2: (p) => <Icon {...p} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />,
            Search: (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />,
            AlertCircle: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></>} />,
            Loader2: (p) => <Icon {...p} className={`animate-spin ${p.className}`} path={<path d="M21 12a9 9 0 1 1-6.219-8.56"/>} />,
            Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
            ListVideo: (p) => <Icon {...p} path={<><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/><path d="M21 12h-6"/><path d="M15 13v-2l3.5-2 3.5 2v2l-3.5 2z"/></>} />,
            List: (p) => <Icon {...p} path={<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>} />
        };

        const STORAGE_KEY = "focus_jee_pro_v4_data";

        // --- DOMAIN SETTINGS ---
        const EMBED_DOMAINS = [
            { id: 'youtube-nocookie', name: 'YouTube (Privacy Mode)', base: 'https://www.youtube-nocookie.com/embed/' },
            { id: 'yewtu', name: 'Invidious (yewtu.be)', base: 'https://yewtu.be/embed/' },
            { id: 'piped', name: 'Piped (piped.video)', base: 'https://piped.video/embed/' },
            { id: 'youtube', name: 'YouTube (Standard)', base: 'https://www.youtube.com/embed/' }
        ];

        // --- RELEVANCE ENGINE ---
        const JEE_KEYWORDS = [
            "jee", "iit", "mains", "advanced", "physics", "chemistry", "math", "maths", 
            "calculus", "algebra", "trigonometry", "mechanics", "kinematics", "thermodynamics", 
            "optics", "electrostatics", "magnetism", "organic", "inorganic", "physical chemistry", 
            "ncert", "cbse", "exam", "study", "lecture", "oneshot", "pyq", "revision", 
            "class 11", "class 12", "notes", "strategy", "syllabus", "solution", "sprint","upnishad ganga","chinmya channel"
        ];
        
        const BLOCKED_KEYWORDS = [
            "game", "gameplay", "trailer", "song", "movie", "prank", "comedy", "roast", 
            "vlog", "dance", "music", "reaction", "challenge", "minecraft", "valorant", "bgmi"
        ];

        const checkRelevance = (title, channel) => {
            const lowerTitle = title.toLowerCase();
            const lowerChannel = channel.toLowerCase();
            
            // 1. Automatic Pass for Trusted Channels
            if (lowerChannel.includes("jee wallah") || lowerChannel.includes("physics wallah") || lowerChannel.includes("pw")) {
                return { allowed: true, reason: "Verified Trusted Channel" };
            }

            // 2. Check for blocked entertainment keywords
            const blockMatch = BLOCKED_KEYWORDS.find(k => lowerTitle.includes(k));
            if (blockMatch) {
                return { allowed: false, reason: `Detected non-academic keyword: "${blockMatch}"` };
            }

            // 3. Check for JEE relevance keywords
            const relevantMatch = JEE_KEYWORDS.find(k => lowerTitle.includes(k));
            if (relevantMatch) {
                return { allowed: true, reason: `Relevant topic found: "${relevantMatch}"` };
            }

            // 4. Default Fail
            return { allowed: false, reason: "No JEE syllabus keywords found in title." };
        };

        // --- COMPONENTS ---

        const Sidebar = ({ folders, activeFolder, setActiveFolder, onCreateFolder, onDeleteFolder, showMobile, onCloseMobile, onOpenSettings }) => (
            <div className={`fixed inset-y-0 left-0 z-40 w-64 bg-slate-950 border-r border-slate-800 transform transition-transform duration-300 ease-in-out ${showMobile ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 flex flex-col`}>
                <div className="p-6 flex items-center justify-between">
                    <h1 className="text-xl font-bold bg-gradient-to-r from-yellow-400 to-orange-500 bg-clip-text text-transparent flex items-center gap-2">
                        <Icons.BookOpen size={24} className="text-yellow-400" />
                        FocusJEE <span className="text-xs bg-slate-800 text-slate-400 px-1 rounded">PRO</span>
                    </h1>
                    <button onClick={onCloseMobile} className="md:hidden text-slate-400 hover:text-white">
                        <Icons.X size={20} />
                    </button>
                </div>

                <div className="px-4 mb-6">
                    <div className="bg-slate-900/50 p-4 rounded-lg border border-slate-800">
                        <p className="text-xs text-slate-500 uppercase font-bold mb-2 flex items-center gap-1">
                            <Icons.Lock size={10} /> Focus Lock Active
                        </p>
                        <p className="text-sm text-slate-300 italic">"Have you done your lectures today? Only academic doubts will be solved."</p>
                    </div>
                </div>

                <div className="px-4 flex-1 overflow-y-auto">
                    <h2 className="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-3">Library</h2>
                    <button 
                        onClick={() => setActiveFolder('all')}
                        className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors mb-1 ${activeFolder === 'all' ? 'bg-yellow-500/10 text-yellow-500 border border-yellow-500/20' : 'text-slate-400 hover:bg-slate-900 hover:text-white'}`}
                    >
                        <Icons.Layout size={18} />
                        All Lectures
                    </button>
                    
                    <div className="mt-6 flex items-center justify-between mb-2">
                        <h2 className="text-xs font-semibold text-slate-600 uppercase tracking-wider">Folders</h2>
                        <button onClick={onCreateFolder} className="text-slate-400 hover:text-yellow-500 transition-colors">
                            <Icons.FolderPlus size={16} />
                        </button>
                    </div>
                    
                    <div className="space-y-1">
                        {folders.map(folder => (
                            <div key={folder.id} className="group flex items-center justify-between">
                                <button 
                                    onClick={() => setActiveFolder(folder.id)}
                                    className={`flex-1 flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition-colors ${activeFolder === folder.id ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' : 'text-slate-400 hover:bg-slate-900 hover:text-white'}`}
                                >
                                    <Icons.Folder size={18} />
                                    <span className="truncate">{folder.name}</span>
                                </button>
                                {folder.id !== 'default' && folder.id !== 'phy' && folder.id !== 'chem' && folder.id !== 'math' && (
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); onDeleteFolder(folder.id); }}
                                        className="opacity-0 group-hover:opacity-100 p-2 text-slate-600 hover:text-red-400 transition-opacity"
                                    >
                                        <Icons.Trash2 size={14} />
                                    </button>
                                )}
                            </div>
                        ))}
                    </div>
                </div>

                <div className="p-4 border-t border-slate-900">
                    <button 
                        onClick={onOpenSettings}
                        className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-slate-900 hover:text-white transition-colors"
                    >
                        <Icons.Settings size={18} />
                        Settings & Domain
                    </button>
                </div>
            </div>
        );

        const VideoPlayer = ({ video, onClose, embedDomain }) => {
            if (!video) return null;
            
            const domainObj = EMBED_DOMAINS.find(d => d.id === embedDomain) || EMBED_DOMAINS[0];
            
            let embedSrc = "";
            if (video.type === 'playlist') {
                // Playlist embed format
                embedSrc = `${domainObj.base}?listType=playlist&list=${video.id}&autoplay=1`;
                // YouTube embed specific adjustment for playlists if using non-standard domains might differ, 
                // but usually ?list= works. Standard YouTube embed needs 'videoseries' or just ?list=
                if(domainObj.id === 'youtube' || domainObj.id === 'youtube-nocookie') {
                     embedSrc = `${domainObj.base}videoseries?list=${video.id}&autoplay=1&rel=0`;
                }
            } else {
                // Single video
                embedSrc = `${domainObj.base}${video.id}?autoplay=1&rel=0&modestbranding=1`;
            }

            return (
                <div className="fixed inset-0 z-50 bg-black flex flex-col animate-in fade-in duration-200">
                    <div className="flex items-center justify-between p-4 bg-slate-950 border-b border-slate-900">
                        <div className="flex items-center gap-4">
                            <span className="text-white font-medium flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                                {video.type === 'playlist' ? 'Playing Playlist' : 'Lecturing'} via {domainObj.name}
                            </span>
                        </div>
                        <button onClick={onClose} className="text-slate-400 hover:text-white flex items-center gap-2 px-4 py-2 bg-slate-900 rounded-lg hover:bg-slate-800 transition-colors">
                            <Icons.X size={18} /> Exit Classroom
                        </button>
                    </div>
                    <div className="flex-1 flex items-center justify-center bg-black">
                        <iframe
                            src={embedSrc}
                            title="FocusJEE Player"
                            className="w-full h-full max-w-7xl aspect-video border-0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowFullScreen
                        ></iframe>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose, currentDomain, setDomain }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
                    <div className="bg-slate-950 border border-slate-800 rounded-xl w-full max-w-md shadow-2xl">
                        <div className="p-6 border-b border-slate-900 flex justify-between items-center">
                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icons.Settings size={20} className="text-yellow-500"/> App Settings
                            </h2>
                            <button onClick={onClose} className="text-slate-500 hover:text-white"><Icons.X size={20}/></button>
                        </div>
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-4">Video Playback Domain</label>
                                <div className="space-y-2">
                                    {EMBED_DOMAINS.map(domain => (
                                        <button
                                            key={domain.id}
                                            onClick={() => setDomain(domain.id)}
                                            className={`w-full flex items-center justify-between p-4 rounded-lg border transition-all ${currentDomain === domain.id ? 'bg-yellow-500/10 border-yellow-500 text-yellow-500' : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'}`}
                                        >
                                            <span className="font-medium">{domain.name}</span>
                                            {currentDomain === domain.id && <Icons.CheckCircle2 size={18} />}
                                        </button>
                                    ))}
                                </div>
                                <p className="mt-4 text-xs text-slate-500 leading-relaxed">
                                    Using privacy domains helps reduce distractions.
                                </p>
                            </div>
                        </div>
                        <div className="p-6 border-t border-slate-900">
                            <button onClick={onClose} className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-lg transition-colors">
                                Save & Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const AddModal = ({ isOpen, onClose, onAdd, folders, loading, error }) => {
            const [url, setUrl] = useState('');
            const [selectedFolder, setSelectedFolder] = useState('default');
            const [inputType, setInputType] = useState('video'); // video | playlist

            if (!isOpen) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                onAdd(url, selectedFolder, inputType);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
                    <div className="bg-slate-950 border border-slate-800 rounded-xl w-full max-w-md shadow-2xl">
                        <div className="p-6 border-b border-slate-900 flex justify-between items-center">
                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icons.Plus size={20} className="text-yellow-500"/> Add Content
                            </h2>
                            <button onClick={onClose} className="text-slate-500 hover:text-white"><Icons.X size={20}/></button>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="p-6 space-y-4">
                            
                            <div className="flex gap-2 p-1 bg-slate-900 rounded-lg border border-slate-800">
                                <button type="button" onClick={() => setInputType('video')} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${inputType === 'video' ? 'bg-slate-800 text-white shadow' : 'text-slate-500 hover:text-slate-300'}`}>Single Video</button>
                                <button type="button" onClick={() => setInputType('playlist')} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${inputType === 'playlist' ? 'bg-slate-800 text-white shadow' : 'text-slate-500 hover:text-slate-300'}`}>Playlist</button>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">
                                    {inputType === 'playlist' ? 'YouTube Playlist URL' : 'YouTube Video URL'}
                                </label>
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={url} 
                                        onChange={(e) => setUrl(e.target.value)} 
                                        placeholder={inputType === 'playlist' ? "https://youtube.com/playlist?list=..." : "https://youtube.com/watch?v=..."}
                                        className="w-full bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-yellow-500" 
                                        required 
                                    />
                                    <Icons.Search className="absolute left-3 top-3.5 text-slate-600" size={18} />
                                </div>
                                <p className="text-[10px] text-slate-500 mt-2">
                                    Supports <span className="text-yellow-500 font-bold">JEE Wallah</span>. Other channels are scanned for syllabus relevance.
                                </p>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Assign to Folder</label>
                                <select value={selectedFolder} onChange={(e) => setSelectedFolder(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-3 text-white focus:outline-none focus:border-yellow-500">
                                    {folders.map(f => (<option key={f.id} value={f.id}>{f.name}</option>))}
                                </select>
                            </div>

                            {error && (
                                <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-xs flex items-start gap-2">
                                    <Icons.AlertCircle size={14} className="mt-0.5 shrink-0" />
                                    <span>{error}</span>
                                </div>
                            )}

                            <button type="submit" disabled={loading} className="w-full bg-yellow-600 hover:bg-yellow-700 disabled:opacity-50 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                                {loading ? <Icons.Loader2 size={18} /> : <Icons.Plus size={18} />}
                                {loading ? 'Checking Relevance...' : 'Add to Library'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [videos, setVideos] = useState([]);
            const [folders, setFolders] = useState([
                { id: 'default', name: 'General' },
                { id: 'phy', name: 'Physics (Class 11)' },
                { id: 'chem', name: 'Chemistry (Class 11)' },
                { id: 'math', name: 'Maths (Class 11)' }
            ]);
            const [settings, setSettings] = useState({
                embedDomain: 'youtube-nocookie' 
            });
            const [activeFolder, setActiveFolder] = useState('all');
            const [currentVideo, setCurrentVideo] = useState(null); // Stores the full video object
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [showMobileMenu, setShowMobileMenu] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        if (data.videos) setVideos(data.videos);
                        if (data.folders) setFolders(data.folders);
                        if (data.settings) setSettings(data.settings);
                    } catch (e) { console.error(e); }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ videos, folders, settings }));
            }, [videos, folders, settings]);

            // Helper to extract IDs
            const extractID = (url, type) => {
                try {
                    const urlObj = new URL(url);
                    if (type === 'playlist') {
                        return urlObj.searchParams.get('list');
                    } else {
                        if (url.includes("youtu.be/")) return url.split("youtu.be/")[1].split("?")[0];
                        return urlObj.searchParams.get('v');
                    }
                } catch(e) { return null; }
            };

            const handleAddContent = async (url, folderId, inputType) => {
                setLoading(true);
                setError(null);
                try {
                    const id = extractID(url, inputType);
                    if (!id) throw new Error(`Invalid ${inputType} URL.`);

                    // Fetch Metadata using NoEmbed (No API Key needed for basic title/author)
                    const oembedUrl = `https://noembed.com/embed?url=${encodeURIComponent(url)}`;
                    const res = await fetch(oembedUrl);
                    const meta = await res.json();

                    if (!meta || !meta.title) {
                        // Fallback if noembed fails to recognize URL structure
                        throw new Error("Could not fetch video details. Please check the URL.");
                    }

                    const title = meta.title;
                    const author = meta.author_name || "Unknown Channel";

                    // --- RELEVANCE CHECK ---
                    const relevance = checkRelevance(title, author);
                    
                    if (!relevance.allowed) {
                        throw new Error(`BLOCKED: ${relevance.reason} Have you done your lectures today?`);
                    }

                    const newContent = {
                        id: id,
                        type: inputType, // 'video' or 'playlist'
                        title: title,
                        thumbnail: meta.thumbnail_url || `https://img.youtube.com/vi/${id}/mqdefault.jpg`,
                        channel: author, 
                        folderId,
                        addedAt: Date.now()
                    };
                    
                    // Specific thumbnail fix for playlists (noembed sometimes gives a generic one, but this is best effort)
                    if (inputType === 'playlist') {
                         newContent.thumbnail = "https://i.ytimg.com/img/no_thumbnail.jpg"; // Fallback or placeholder
                         // Try to see if meta provides one, otherwise:
                         if(meta.thumbnail_url) newContent.thumbnail = meta.thumbnail_url;
                    }

                    setVideos(prev => [newContent, ...prev]);
                    setIsAddModalOpen(false);
                } catch (err) { 
                    setError(err.message); 
                } finally { 
                    setLoading(false); 
                }
            };

            const handleDeleteVideo = (id) => { setVideos(videos.filter(v => v.id !== id)); };

            const filteredVideos = activeFolder === 'all' ? videos : videos.filter(v => v.folderId === activeFolder);

            return (
                <div className="min-h-screen bg-black text-slate-200 font-sans selection:bg-yellow-500/30">
                    <div className="md:hidden bg-slate-950 border-b border-slate-900 p-4 flex items-center justify-between sticky top-0 z-30">
                        <button onClick={() => setShowMobileMenu(true)}><Icons.Menu size={24} /></button>
                        <span className="font-bold text-yellow-500">FocusJEE</span>
                        <button onClick={() => setIsAddModalOpen(true)} className="text-yellow-500"><Icons.Plus size={24} /></button>
                    </div>

                    <Sidebar 
                        folders={folders} activeFolder={activeFolder} setActiveFolder={setActiveFolder}
                        onCreateFolder={() => {const n = prompt("Name:"); if(n) setFolders([...folders,{id:Date.now().toString(), name:n}])}}
                        onDeleteFolder={(id) => setFolders(folders.filter(f=>f.id!==id))}
                        showMobile={showMobileMenu} onCloseMobile={() => setShowMobileMenu(false)}
                        onOpenSettings={() => setIsSettingsOpen(true)}
                    />

                    <div className="md:ml-64 min-h-screen flex flex-col">
                        <div className="sticky top-0 z-20 bg-black/80 backdrop-blur-xl border-b border-slate-900 p-6 flex items-center justify-between">
                            <h1 className="text-2xl font-bold text-white flex items-center gap-2">
                                {activeFolder === 'all' ? 'Library' : folders.find(f => f.id === activeFolder)?.name}
                                <span className="text-xs font-normal text-slate-500 bg-slate-900 px-2 py-0.5 rounded-full border border-slate-800">{filteredVideos.length}</span>
                            </h1>
                            <button onClick={() => setIsAddModalOpen(true)} className="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-bold text-sm transition-all shadow-lg shadow-yellow-600/10">
                                <Icons.Plus size={16} /> Add Content
                            </button>
                        </div>

                        <div className="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {filteredVideos.length === 0 ? (
                                <div className="col-span-full py-24 flex flex-col items-center border-2 border-dashed border-slate-900 rounded-2xl">
                                    <Icons.ListVideo size={48} className="text-slate-800 mb-4" />
                                    <p className="text-slate-500">No lectures in this folder yet.</p>
                                    <button onClick={() => setIsAddModalOpen(true)} className="mt-4 text-yellow-500 hover:text-yellow-400 text-sm">Add your first video</button>
                                </div>
                            ) : (
                                filteredVideos.map(video => (
                                    <div key={video.id} className="group bg-slate-950 border border-slate-900 rounded-xl overflow-hidden hover:border-yellow-500/50 transition-all hover:-translate-y-1">
                                        <div className="relative aspect-video cursor-pointer" onClick={() => setCurrentVideo(video)}>
                                            <img src={video.thumbnail} alt={video.title} className="w-full h-full object-cover" />
                                            <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                                <div className="w-12 h-12 bg-yellow-500 rounded-full flex items-center justify-center text-black">
                                                    {video.type === 'playlist' ? <Icons.List fill="currentColor" size={20} /> : <Icons.Play fill="currentColor" size={20} className="ml-1" />}
                                                </div>
                                            </div>
                                            {video.type === 'playlist' && (
                                                <div className="absolute bottom-2 right-2 bg-slate-900/90 text-white text-[10px] px-2 py-1 rounded flex items-center gap-1 border border-slate-700">
                                                    <Icons.List size={10} /> Playlist
                                                </div>
                                            )}
                                        </div>
                                        <div className="p-4">
                                            <h3 className="text-sm font-medium text-slate-200 line-clamp-2 mb-2 h-10" title={video.title}>{video.title}</h3>
                                            <div className="flex items-center justify-between pt-2 border-t border-slate-900">
                                                <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest truncate max-w-[120px]">{video.channel}</span>
                                                <button onClick={() => handleDeleteVideo(video.id)} className="text-slate-600 hover:text-red-500 transition-colors"><Icons.Trash2 size={14} /></button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <VideoPlayer video={currentVideo} onClose={() => setCurrentVideo(null)} embedDomain={settings.embedDomain} />
                    <SettingsModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} currentDomain={settings.embedDomain} setDomain={(d) => setSettings({...settings, embedDomain: d})} />
                    <AddModal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} onAdd={handleAddContent} folders={folders} loading={loading} error={error} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
